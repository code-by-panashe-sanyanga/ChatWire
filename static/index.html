<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatWire</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Socket.IO client library. It keeps the chat simple for this project. -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <!-- Top bar with the app name and the current room -->
  <header>
    <div class="brand">
      <h1>ChatWire</h1>
      <p>Real time room chat</p>
    </div>
    <div class="header-actions">
      <span id="room-label">Not connected</span>
      <button id="leave" class="hidden" type="button">Leave</button>
    </div>
  </header>

  <main>
    <!-- This screen shows first. You type your name and a room, then click Join. -->
    <section id="setup" class="panel">
      <p class="eyebrow">Socket chat</p>
      <h2>Join a chat room</h2>
      <p class="setup-text">Use the same room name in another tab to test messages.</p>
      <label>
        Your name
        <input id="user" placeholder="Panashe" />
      </label>
      <label>
        Room name
        <input id="room" placeholder="lobby" value="lobby" />
      </label>
      <button id="join" type="button">Join room</button>
    </section>

    <!-- The chat area. Hidden until you join. -->
    <section id="chat" class="panel hidden">
      <div class="chat-top">
        <div>
          <h2 id="chat-title">Room chat</h2>
          <p id="chat-status">Connected. Start chatting below.</p>
        </div>
      </div>

      <ul id="log"></ul>

      <form id="form">
        <input id="text" autocomplete="off" placeholder="Type a message..." />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
